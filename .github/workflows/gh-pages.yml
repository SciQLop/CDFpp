name: Deploy WASM demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wacdfpp/**'
      - 'include/**'
      - 'meson.build'
      - '.github/workflows/gh-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the module to releases
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.9

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Configure
        run: >
          meson setup build_wasm
          --cross-file wacdfpp/wasm.txt
          -Ddisable_python_wrapper=true
          -Dwith_experimental_wasm=true
          -Dwith_experimental_zstd=true
          -Dwith_experimental_blosc2=true

      - name: Build
        run: ninja -C build_wasm

      # Same module with 64-bit memory, loaded by the converter for files over wasm32's 4 GiB.
      - name: Configure wasm64
        run: >
          meson setup build_wasm64
          --cross-file wacdfpp/wasm64.txt
          -Ddisable_python_wrapper=true
          -Dwith_experimental_wasm=true
          -Dwith_experimental_zstd=true
          -Dwith_experimental_blosc2=true

      - name: Build wasm64
        run: ninja -C build_wasm64

      - name: Prepare pages
        run: |
          mkdir -p _site
          # cdfpp.js/.wasm + the ES modules (app/cdf-model/render/plot-model/spectrogram/
          # plot/astralint) + vendored uPlot (.js/.css)
          cp build_wasm/wacdfpp/*.js build_wasm/wacdfpp/*.wasm build_wasm/wacdfpp/*.css _site/
          cp build_wasm/wacdfpp/wacdfpp.html _site/index.html
          cp build_wasm64/wacdfpp/cdfpp64.js build_wasm64/wacdfpp/cdfpp64.wasm _site/

      # The JavaScript module alone, for use in other web apps: a workflow artifact on every run,
      # and a versioned download attached to each release.
      - name: Package the JavaScript module
        run: |
          version=${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}
          mkdir -p cdfpp-wasm
          cp build_wasm/wacdfpp/cdfpp.js build_wasm/wacdfpp/cdfpp.wasm \
             build_wasm64/wacdfpp/cdfpp64.js build_wasm64/wacdfpp/cdfpp64.wasm \
             wacdfpp/cdfpp.d.ts COPYING cdfpp-wasm/
          zip -r "cdfpp-wasm-${version}.zip" cdfpp-wasm
          echo "WASM_ZIP=cdfpp-wasm-${version}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: cdfpp-wasm
          path: ${{ env.WASM_ZIP }}

      - name: Attach the JavaScript module to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$WASM_ZIP"

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'release'

  deploy:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
